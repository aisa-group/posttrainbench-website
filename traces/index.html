  <!-- Hero — title above; below, the (benchmark × base model) matrix on
       the left and a corpus-shape stats column on the right. The matrix
       doubles as the page's primary navigation: cells are clickable and
       set the (benchmark, base-model) filter pair. -->
  <section class="page-head">
    <div class="container page-head-inner">
      <h1>Agent traces</h1>
      <div class="hero-body">
        <div id="matrix-wrap" class="matrix-wrap" aria-label="Runs by task and base model">
          <div class="matrix-scroll-frame">
            <div id="matrix" class="matrix"></div>
          </div>
          <div class="matrix-legend" id="matrix-legend" aria-hidden="true"></div>
        </div>
        <aside class="hero-stats" id="hero-stats" aria-label="Corpus stats"></aside>
      </div>
    </div>
  </section>

  <main class="container traces-browser">
    <section class="catalog-controls" aria-label="Browse runs">
      <!-- Primary controls: narrow the corpus directly or search it. -->
      <div class="filter-dock" role="search">
        <div class="filter-group">
          <select id="benchmark-filter" aria-label="Filter by benchmark">
            <option value="">all benchmarks</option>
          </select>
          <select id="trained-model-filter" aria-label="Filter by base model">
            <option value="">all base models</option>
          </select>
          <select id="agent-filter" aria-label="Filter by agent">
            <option value="">all agents</option>
          </select>
        </div>
        <label class="filter-search">
          <svg class="filter-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="search" id="q" aria-label="Search runs"
                 placeholder="search runs…" />
        </label>
      </div>

      <!-- Secondary controls change presentation, not the result set. -->
      <div class="view-controls">
        <div class="view-controls-left">
          <select id="group-by" aria-label="Group runs">
            <option value="task">group by task</option>
            <option value="task-model">group by task × model</option>
            <option value="experiment">group by experiment</option>
            <option value="none">no grouping</option>
          </select>
          <select id="sort" aria-label="Sort runs">
            <option value="accuracy-desc">accuracy ↓</option>
            <option value="accuracy-asc">accuracy ↑</option>
            <option value="cost-desc">cost ↓</option>
            <option value="turns-desc">turns ↓</option>
            <option value="duration-desc">duration ↓</option>
          </select>
        </div>
        <div class="view-controls-right">
          <span id="result-count" class="results-count muted hidden"></span>
          <button id="reset-filters" class="link-btn hidden" type="button">clear filters</button>
        </div>
      </div>
    </section>

    <div id="runs" aria-live="polite"></div>
    <div id="empty" class="empty-state hidden">
      <p>No runs match the current filters.</p>
      <button class="btn btn-secondary" type="button" id="empty-reset">Clear filters</button>
    </div>
    <div id="loading" class="empty-state">
      <p class="muted">Loading runs…</p>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="assets/theme.js"></script>
  <script src="assets/nav.js" defer></script>
  <script src="assets/tooltip.js"></script>
  <script src="assets/catalog.js"></script>
  <script src="assets/index.js"></script>
  <script>
    window.goatcounter = {
      path: function () { return window.location.pathname; },
    };

  <script data-goatcounter="https://hrdkbhatnagar.goatcounter.com/count"
