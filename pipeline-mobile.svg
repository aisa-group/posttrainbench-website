<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" role="img" aria-labelledby="pipeline-mobile-title pipeline-mobile-desc">
  <title id="pipeline-mobile-title">PostTrainBench pipeline diagram</title>
  <desc id="pipeline-mobile-desc">An agent post-trains a base LLM for 10 hours, submits a model through an anti-cheat gate, then clean submissions run through evaluation to produce a benchmark score. Cheating submissions receive the base LLM score.</desc>
  <defs>
    <style>
      @font-face {
        font-family: 'Die Grotesk';
        src: url('/fonts/die-grotesk-vf-roman.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      .node {
        fill: #fff;
        stroke: none;
      }

      .arrow {
        stroke: #aaa399;
        stroke-width: 1.15;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrowhead);
      }

      .line {
        stroke: #aaa399;
        stroke-width: 1.15;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .title, .body, .note, .label {
        font-family: 'Die Grotesk', sans-serif;
      }

      .title {
        font-size: 13.5px;
        font-weight: 500;
        fill: #2d2a23;
      }

      .body, .note, .label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        fill: #6b655a;
      }

      .label {
        dominant-baseline: middle;
      }
    </style>
    <marker id="arrowhead" markerWidth="5" markerHeight="5" refX="4.4" refY="2.5" orient="auto">
      <polyline points="1.2 1.2, 4 2.5, 1.2 3.8" fill="none" stroke="#aaa399" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="26" y="16" width="268" height="70" rx="9" class="node"/>
  <text x="160" y="45" class="title" text-anchor="middle">Base LLM + script</text>
  <text x="160" y="66" class="body" text-anchor="middle">10h · H100 · web</text>

  <path d="M 160 86 L 160 123" class="arrow"/>

  <rect x="62" y="132" width="196" height="56" rx="9" class="node"/>
  <text x="160" y="154" class="title" text-anchor="middle">Agent run</text>
  <text x="160" y="174" class="body" text-anchor="middle">post-trains model</text>

  <path d="M 160 188 L 160 203" class="arrow"/>

  <rect x="119" y="219" width="82" height="82" rx="6" class="node" transform="rotate(45 160 260)"/>
  <text x="160" y="265" class="title" text-anchor="middle">Cheat check</text>

  <path d="M 160 318 L 160 332" class="line"/>
  <path d="M 160 332 L 90 332 L 90 343" class="arrow"/>
  <path d="M 160 332 L 230 332 L 230 343" class="arrow"/>
  <text x="90" y="324" class="label" text-anchor="middle">Cheating</text>
  <text x="230" y="324" class="label" text-anchor="middle">Clean</text>

  <rect x="26" y="352" width="128" height="52" rx="9" class="node"/>
  <text x="90" y="383" class="title" text-anchor="middle">Base Score</text>

  <rect x="166" y="352" width="128" height="52" rx="9" class="node"/>
  <text x="230" y="383" class="title" text-anchor="middle">Evaluation</text>

  <path d="M 230 404 L 230 427 L 160 427 L 160 441" class="arrow"/>

  <rect x="62" y="450" width="196" height="44" rx="9" class="node"/>
  <text x="160" y="477" class="title" text-anchor="middle">Benchmark Score</text>

</svg>
