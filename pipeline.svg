<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">PostTrainBench pipeline diagram</title>
  <desc id="pipeline-desc">An agent post-trains a base LLM for 10 hours, submits a model through an anti-cheat gate, then clean submissions run through evaluation to produce a benchmark score. Cheating submissions receive the base LLM score.</desc>
  <defs>
    <style>
      @font-face {
        font-family: 'Die Grotesk';
        src: url('/fonts/die-grotesk-vf-roman.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      .node {
        fill: #fff;
        stroke: none;
      }

      .arrow {
        stroke: #aaa399;
        stroke-width: 1.15;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrowhead);
      }

      .line {
        stroke: #aaa399;
        stroke-width: 1.15;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .title, .body, .note, .label {
        font-family: 'Die Grotesk', sans-serif;
      }

      .title {
        font-size: 13.5px;
        font-weight: 500;
        fill: #2d2a23;
      }

      .body, .note, .label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        fill: #6b655a;
      }

      .label {
        dominant-baseline: middle;
      }
    </style>
    <marker id="arrowhead" markerWidth="5" markerHeight="5" refX="4.4" refY="2.5" orient="auto">
      <polyline points="1.2 1.2, 4 2.5, 1.2 3.8" fill="none" stroke="#aaa399" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="20" y="78" width="160" height="80" rx="9" class="node"/>
  <text x="100" y="112" class="title" text-anchor="middle">Base LLM + script</text>
  <text x="100" y="136" class="body" text-anchor="middle">10h · H100 · web</text>

  <path d="M 180 118 L 212 118" class="arrow"/>

  <rect x="220" y="78" width="160" height="80" rx="9" class="node"/>
  <text x="300" y="112" class="title" text-anchor="middle">Agent run</text>
  <text x="300" y="136" class="body" text-anchor="middle">post-trained LLM</text>

  <path d="M 380 118 L 442 118" class="arrow"/>

  <rect x="464" y="82" width="72" height="72" rx="6" class="node" transform="rotate(45 500 118)"/>
  <text x="500" y="123" class="title" text-anchor="middle">Cheat check</text>

  <path d="M 558 118 L 604 118" class="line"/>
  <path d="M 604 118 L 604 78 L 612 78" class="arrow"/>
  <text x="594" y="78" class="label" text-anchor="end">Cheating</text>

  <rect x="620" y="52" width="160" height="52" rx="9" class="node"/>
  <text x="700" y="83" class="title" text-anchor="middle">Base LLM Score</text>

  <path d="M 604 118 L 604 156 L 612 156" class="arrow"/>
  <text x="594" y="156" class="label" text-anchor="end">Clean</text>

  <rect x="620" y="130" width="160" height="52" rx="9" class="node"/>
  <text x="700" y="161" class="title" text-anchor="middle">Evaluation</text>

  <path d="M 780 156 L 812 156" class="arrow"/>

  <rect x="820" y="130" width="160" height="52" rx="9" class="node"/>
  <text x="900" y="161" class="title" text-anchor="middle">Benchmark Score</text>

</svg>
